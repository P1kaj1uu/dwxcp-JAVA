spring.application.name=dwxcp
server.port=2645

# ============ Tomcat ============
server.tomcat.max-threads=200
server.tomcat.accept-count=200
server.tomcat.max-connections=2000
server.tomcat.connection-timeout=20000
server.tomcat.min-spare-threads=25
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,text/javascript
server.compression.min-response-size=1024
server.servlet.session.timeout=30m

# ============ 上传 ============
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
server.tomcat.max-swallow-size=200MB
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# ============ DataSource (HikariCP - Spring Boot 2 默认连接池) ============
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/dwxcp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&rewriteBatchedStatements=true&useServerPrepStmts=true&cachePrepStmts=true&prepStmtCacheSize=500&prepStmtCacheSqlLimit=2048&useLocalSession=true&tcpKeepAlive=true&socketTimeout=30000&connectTimeout=10000
spring.datasource.username=root
spring.datasource.password=123456

spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.pool-name=dwxcp-pool
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.leak-detection-threshold=30000

# ============ MyBatis-Plus ============
mybatis-plus.mapper-locations=classpath*:com/springboot/mapper/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.default-fetch-size=500
mybatis-plus.configuration.default-statement-timeout=30
mybatis-plus.configuration.use-generated-keys=true
mybatis-plus.configuration.cache-enabled=false
mybatis-plus.configuration.aggressive-lazy-loading=false
mybatis-plus.configuration.lazy-loading-enabled=false
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.banner=false
mybatis-plus.global-config.db-config.logic-delete-field=
mybatis-plus.global-config.db-config.logic-delete-value=
mybatis-plus.executor-type=reuse

# ============ PageHelper ============
pagehelper.helper-dialect=mysql
pagehelper.reasonable=true
pagehelper.support-methods-arguments=true
pagehelper.params=count=countSql
pagehelper.page-size-zero=true

# ============ Jackson（替代 fastjson，更安全更快）============
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ============ 日志 ============
logging.level.root=INFO
logging.level.com.springboot.dwxcp=INFO
logging.level.com.springboot.dwxcp.mapper=WARN
logging.level.com.zaxxer.hikari=WARN
